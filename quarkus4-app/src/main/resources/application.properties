# Campfire's environment (SECRET_KEY_BASE, CAMPFIRE_DATABASE_PATH, RAILS_MAX_THREADS, HTTP_PORT, ...)
# is read as the Rust and Kotlin ports read it; these map it onto Quarkus.
quarkus.http.port=${HTTP_PORT:3000}
quarkus.http.host=0.0.0.0
quarkus.http.accept-backlog=1024
quarkus.http.idle-timeout=${HTTP_IDLE_TIMEOUT:60}S
# Quarkus 4: native transport is opt-in and fixed at build time; epoll, as the Kotlin port uses.
quarkus.vertx.native-transport=required
quarkus.vertx.native-transport-type=epoll
quarkus.banner.enabled=false

# The database file, derived as the Rust and Kotlin ports derive it; every connection opens this one.
campfire.database-path=${CAMPFIRE_DATABASE_PATH:${CAMPFIRE_STORAGE_PATH:storage}/db/${RAILS_ENV:production}.sqlite3}

# SQLite's library: the Rust port's amalgamation built with its flags (the Kotlin port's native/build.sh).
campfire.sqlite-lib=${CAMPFIRE_SQLITE_LIB}

quarkus.log.level=INFO

