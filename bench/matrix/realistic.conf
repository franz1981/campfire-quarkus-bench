# The realistic workload (bench/Workload.java, bench/realistic-rate.hf.yaml): page loads at fixed rates
# (open model, --rate R,R... page loads/s; choose them for your machine), each a random session's room,
# with the writes of the visible tabs that load them: each tab loads a room page every PAGE_EVERY s,
# refreshes its presence every PRESENCE_EVERY s (presence_controller.js: 50 s while visible) and posts a
# message every MESSAGE_EVERY s, so per page load 1.2 presence commits and 0.1 messages by default. A
# writer outside the apps commits them to each app's database during each step: the same rows for every
# app. Caches stay on. Every (person, room) page is compared with the Rust port's before the first step.
# Not modelled: WebSockets (broadcasts, idle connections) and writes inside the apps (README.md).
CORES="4"
APPS="rust kotlin quarkus"
RATES="333 833 1667"     # page loads/s (--rate): 20k, 50k and 100k visible tabs; on a 7950X below and at saturation
PAGE_EVERY=60            # s between a tab's page loads (a guess: one room opened a minute)
PRESENCE_EVERY=50        # s between a visible tab's presence refreshes (Campfire's client)
MESSAGE_EVERY=600        # s between a tab's messages (a guess)
SESSIONS=1000            # sessions the page loads use, over the seed's 5 active people
MESSAGE_ROOM=all         # a room id, or all
REPS=3
SECS=20                  # 6,700 page loads at 333/s
WARMUP=20
RATE_CONNS=2048
HF_WARMUP=5
WORKLOAD=realistic
