# The article's matrix: the method of the Kotlin port's bench/cloud/remote-bench.sh, on your machine.
# Closed loop: every app at each connection count, REPS reps in alternating app order, a 16-connection
# warmup after every start, every response checked byte for byte against the Rust page.
# Fixed TPS (with --fixed-tps): OPEN_FRACTIONS of the best app's median req/s at 64 connections, OPEN_REPS reps.
CORES="4"
APPS="rust kotlin quarkus"
CONNS="1 16 64 256 1024 4096"
REPS=3
SECS=15
WARMUP=20
OPEN=0
OPEN_REPS=2
OPEN_CONNS=2048
OPEN_FRACTIONS="0.5 0.7 0.8 0.9 1.0 1.1 1.2 1.4"
HF_WARMUP=5
