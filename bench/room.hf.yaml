# The room page all out (closed loop): USERS sessions over CONNS keep-alive connections, each sending
# its next request as soon as its response is in; the same request as room-rate.hf.yaml. USERS = CONNS,
# as in Hyperfoil's own wrk mapping (docs, "migration from wrk": users and sharedConnections from -c).
# A WARMUP phase comes first; the measured phase starts only once it has terminated (startAfterStrict),
# so the two never share connections, and stops at MAX_DURATION even if responses are still missing.
name: campfire-room
threads: !param THREADS 4
http:
  host: !concat [ "http://127.0.0.1:", !param PORT 4390 ]
  allowHttp2: false
  useHttpCache: false
  sharedConnections: !param CONNS 1024
ergonomics:
  userAgentFromSession: false
  repeatCookies: false
phases:
- warmup:
    always:
      users: !param USERS 1024
      duration: !param WARMUP 5s
      scenario: &scenario
        maxRequests: 1
        maxSequences: 1
        orderedSequences:
        - fetch:
          - httpRequest:
              GET: !concat [ "/rooms/", !param ROOM 486777696 ]
              # Hyperfoil's default SLA fails a phase if any request waits for a free connection, which
              # also cancels the measured phase after a warmup; bench.sh reports that wait instead.
              sla:
              - blockedRatio: 1000
              headers:
                accept: "*/*"
                user-agent: curl/8.7.1
                cookie: !param COOKIE
                accept-encoding: gzip
- main:
    always:
      startAfterStrict: warmup
      users: !param USERS 1024
      duration: !param DURATION 15s
      maxDuration: !param MAX_DURATION 60s
      scenario: *scenario
